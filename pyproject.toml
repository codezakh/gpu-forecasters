[project]
name = "gpu-forecasters"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Zaid Khan", email = "brain@zaidkhan.me" }
]
requires-python = ">=3.13"
dependencies = [
    "ipdb>=0.13.13",
    "modal>=1.0",
    "kernelbench",
    "litellm>=1.81.5",
    "loguru>=0.7.3",
    "matplotlib>=3.10.8",
    "peft>=0.18.0",
    "pytest>=9.0.2",
    "python-ulid>=3.1.0",
    "seaborn>=0.13.2",
    "textual[syntax]>=6.2.1",
    "textualize>=0.1",
    "torch >= 2.5.1",
    "transformers >= 4.57.3",
    "wandb>=0.23.1",
    "scipy>=1.17.1",
    "pydantic-ai>=1.0",
    "fastmcp>=3.2.4",
    "docker>=7.1.0",
    "tinker>=0.18.1",
    "chz>=0.4.0",
    "tiktoken>=0.12.0",
    "safetensors>=0.7.0",
    "termcolor>=3.3.0",
    "tinker-cookbook",
]

[project.scripts]
gpu-forecasters = "gpu_forecasters:main"
bootstrap-trimul-leaderboard = "gpu_forecasters.trimul.leaderboard_comparison:_cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
sources = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/gpu_forecasters"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
addopts = '-v -ra --strict-markers -m "not integration"'
markers = [
    "asyncio: mark test as async",
    "cuda: requires CUDA-capable GPU",
    "integration: integration test requiring external services",
    "modal: requires Modal authentication and a remote GPU",
    "poisoning: test that intentionally poisons CUDA context (run in isolation)",
    "slow: self-explanatory"
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
]
# KernelBench is third-party; we don't edit it frequently.
# Install it editable so KernelBench can find its on-disk dataset directory
# at `third_party/KernelBench/KernelBench/level*`. The upstream package computes
# `REPO_TOP_PATH` from `__file__`, which points inside `.venv` for non-editable
# installs, causing `source="local"` dataset loads to fail.
# tinker-cookbook is a third-party submodule we consume directly; it is NOT a
# workspace member because its `[all]`/`[eval]`/`[inspect]`/... extras pull
# transitive deps (inspect-ai -> litellm[proxy] -> boto3 pins) that conflict
# with our litellm/textual constraints. Workspace membership would force
# universal resolution to satisfy every extra jointly; path-style sidesteps
# that since we don't request any extras.
tinker-cookbook = { path = "third_party/tinker-cookbook", editable = true }
kernelbench = { workspace = true, editable = true }

[tool.ty.src]
exclude = [
    "src/gpu_forecasters/kernelbench/eval_logged.py", # This is a copy of the eval function from KernelBench with logging added.
]

[tool.uv.workspace]
members = [
    "third_party/KernelBench",
]
