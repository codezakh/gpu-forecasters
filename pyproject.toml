[project]
name = "15-arid-badger"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Zaid Khan", email = "brain@zaidkhan.me" }
]
requires-python = ">=3.13"
dependencies = [
    "kernelbench",
    "litellm>=1.81.5",
    "loguru>=0.7.3",
    "matplotlib>=3.10.8",
    "peft>=0.18.0",
    "pytest>=9.0.2",
    "torch >= 2.5.1",
    "transformers >= 4.57.3",
    "wandb>=0.23.1",
]

[project.scripts]
15-arid-badger = "arid_badger:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
sources = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/arid_badger"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
addopts = "-v -ra --strict-markers"
markers = [
    "asyncio: mark test as async",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
]
kernelbench = { workspace = true, editable = true }

[tool.uv.workspace]
members = [
    "third_party/KernelBench",
]
